name: Python CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # signal-copier/ and signal-portfolio-commercial/ are separate,
        # unrelated projects (see their own READMEs) with their own
        # dependency sets and their own dedicated, path-scoped CI
        # (.github/workflows/signal-copier-ci.yml,
        # .github/workflows/signal-portfolio-commercial-ci.yml) -- this
        # root job's `pip install -r requirements.txt` never installs
        # either one's requirements, so letting bare `pytest` also collect
        # their tests/** here fails at collection time (missing imports)
        # or, for signal-portfolio-commercial, needs a real disposable
        # Postgres cluster this job never provisions. The root project
        # itself has no tests of its own yet, so with both excluded,
        # pytest exits 5 ("no tests collected") -- that's correct, not a
        # failure, so it's tolerated explicitly here.
        run: pytest --ignore=signal-copier --ignore=signal-portfolio-commercial || [ $? -eq 5 ]
