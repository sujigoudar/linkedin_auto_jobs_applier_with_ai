name: Python CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # signal-copier/ is a separate, unrelated project (see its own
        # README) with its own dependency set and its own dedicated,
        # path-scoped CI (.github/workflows/signal-copier-ci.yml) --
        # this root job's `pip install -r requirements.txt` never installs
        # signal-copier's requirements, so letting bare `pytest` also
        # collect signal-copier/tests/** here fails at collection time.
        # The root project itself has no tests of its own yet, so with
        # signal-copier excluded, pytest exits 5 ("no tests collected") --
        # that's correct, not a failure, so it's tolerated explicitly here.
        run: pytest --ignore=signal-copier || [ $? -eq 5 ]
