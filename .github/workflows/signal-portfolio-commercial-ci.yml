name: signal-portfolio-commercial CI

on:
  push:
    paths:
      - 'signal-portfolio-commercial/**'
      - '.github/workflows/signal-portfolio-commercial-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'signal-portfolio-commercial/**'
      - '.github/workflows/signal-portfolio-commercial-ci.yml'

defaults:
  run:
    working-directory: signal-portfolio-commercial

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # tests/conftest.py starts and tears down its own disposable
      # PostgreSQL cluster per test session (see that file's own
      # docstring) -- it expects real postgresql-16 server binaries at
      # /usr/lib/postgresql/16/bin, matching this development
      # environment, so the runner needs the same package installed
      # rather than relying on whatever Postgres version happens to be
      # preinstalled on the image.
      - name: Install PostgreSQL 16 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies for known advisories (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # Real migration verification, separate from the test suite's own
      # per-test disposable schema (tests/conftest.py never runs Alembic
      # -- it uses Base.metadata.create_all directly): starts one more
      # disposable cluster and runs the actual `alembic upgrade head`
      # a real deployment would run, so a broken migration (e.g. the
      # transaction-visibility bug the RLS/append-only revision hit
      # during development) fails CI instead of surfacing only at
      # deploy time.
      - name: Verify Alembic migrations apply cleanly
        run: |
          set -e
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          PGDATA=$(mktemp -d)
          PORT=55433
          initdb --auth=trust -D "$PGDATA"
          pg_ctl -D "$PGDATA" -o "-p $PORT -k $PGDATA -c listen_addresses=127.0.0.1" -l "$PGDATA/server.log" -w start
          createdb -h 127.0.0.1 -p $PORT -U "$(whoami)" commercial_migration_check
          ALEMBIC_DATABASE_URL="postgresql+psycopg://$(whoami)@127.0.0.1:$PORT/commercial_migration_check" python -m alembic upgrade head
          pg_ctl -D "$PGDATA" -m fast stop
          rm -rf "$PGDATA"
