name: signal-copier CI

on:
  push:
    paths:
      - 'signal-copier/**'
      - '.github/workflows/signal-copier-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'signal-copier/**'
      - '.github/workflows/signal-copier-ci.yml'

defaults:
  run:
    working-directory: signal-copier

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv (C35, faster installs via a shared package cache)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: signal-copier/requirements.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Install Playwright's Chromium (C14/C33/C34)
        run: playwright install --with-deps chromium

      - name: Lint (C38, ruff -- see pyproject.toml for the scoped ruleset)
        run: ruff check .

      - name: Type check (C38, mypy -- see pyproject.toml for scope/config)
        run: |
          python -m mypy app/db.py app/engine.py app/reconciliation.py app/lifecycle/manager.py app/lifecycle/models.py \
               app/routing.py app/risk.py app/models.py app/main.py app/backtest/simulator.py app/sources/webhook.py \
               app/sources/whatsapp.py app/sources/sms_twilio.py app/sources/ninjatrader.py \
               app/sources/text_parser.py app/sources/base.py app/brokers/alpaca.py app/brokers/base.py \
               app/brokers/paper.py app/brokers/ccxt_broker.py app/brokers/signalstack.py app/brokers/ninjatrader.py \
               app/config.py app/auth.py app/rate_limit.py app/context/sec_edgar.py app/context/fred.py app/context/fx.py \
               app/capital_allocator.py app/provider_value.py app/provider_scout.py \
               app/provider_catalog.py app/connections.py \
               app/certification.py app/certification_evidence.py app/certification_scorecard.py app/shadow_mode.py \
               app/parser_tooling.py app/connection_catalog.py \
               app/sources/adapter_contract.py app/sources/url_safety.py app/sources/rss_source.py \
               app/export_events.py \
               app/workflow/reasons.py app/workflow/money.py app/workflow/admission.py app/workflow/selection.py \
               app/workflow/kelly.py app/workflow/sizing.py \
               --follow-imports=silent

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies for known advisories (C36, adoption plan)
        run: |
          uv pip install --system pip-audit
          # CVE-2026-49265 (oauthlib < 4.0.0): tweepy (the Twitter/X source
          # adapter's own real dependency -- see requirements.txt and
          # tests/test_sig05_bridge_collector_lifecycle_handling.py) pins
          # `oauthlib<4,>=3.2.0` as of its latest release (4.17.0) on PyPI;
          # there is currently no tweepy release compatible with oauthlib
          # 4.0.0, so this cannot be closed by a version bump today. Ignored
          # here, not silently -- re-check this exception whenever tweepy
          # publishes a release without the <4 cap.
          pip-audit -r requirements.txt --ignore-vuln CVE-2026-49265

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (C37, adoption plan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: signal-copier/.gitleaks.toml
