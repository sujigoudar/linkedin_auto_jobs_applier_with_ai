name: Pinned copier audit baseline
on:
  push:
    branches: ['audit/fccf57a-e2e-20260926']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [core, linux-adapters]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sujigoudar/linkedin_auto_jobs_applier_with_ai
          ref: fccf57affd8515fe059b1af854856828078a737e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install selected dependency profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python -m pip install -r signal-copier/requirements.txt pytest-cov pytest-timeout pytest-socket > "$RUNNER_TEMP/evidence/install-core.txt" 2>&1
          if [ '${{ matrix.profile }}' = 'linux-adapters' ]; then
            for package in ccxt ib_insync async_rithmic twilio python-telegram-bot discord.py slack-bolt tweepy metaapi-cloud-sdk; do
              python -m pip install "$package" > "$RUNNER_TEMP/evidence/install-${package}.txt" 2>&1 || echo "$package" >> "$RUNNER_TEMP/evidence/unavailable-packages.txt"
            done
          fi
          python -m pip freeze > "$RUNNER_TEMP/evidence/freeze.txt"
          python -m pip check > "$RUNNER_TEMP/evidence/pip-check.txt" 2>&1 || true
          git rev-parse HEAD > "$RUNNER_TEMP/evidence/revision.txt"
      - name: Run every collected application test without outbound sockets
        shell: bash
        working-directory: signal-copier
        run: |
          set +e
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" DATABASE_PATH="$RUNNER_TEMP/isolated.db" python -m pytest --collect-only -q --disable-socket --allow-unix-socket > "$RUNNER_TEMP/evidence/collection.txt" 2>&1
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" DATABASE_PATH="$RUNNER_TEMP/isolated.db" python -m pytest -ra --timeout=45 --disable-socket --allow-unix-socket --cov=app --cov-branch --cov-report=term-missing --cov-report=json:"$RUNNER_TEMP/evidence/coverage.json" --junitxml="$RUNNER_TEMP/evidence/results.xml" > "$RUNNER_TEMP/evidence/pytest.txt" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/evidence/pytest.txt"
          echo "$rc" > "$RUNNER_TEMP/evidence/exit-code.txt"
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-baseline-${{ matrix.profile }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
  offline-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccf57affd8515fe059b1af854856828078a737e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download dependencies for credential-free offline auditing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheels" "$RUNNER_TEMP/wheel-logs"
          python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/wheels" -r signal-copier/requirements.txt > "$RUNNER_TEMP/wheel-logs/core.log" 2>&1
          for package in pytest-cov pytest-timeout pytest-socket hypothesis ruff bandit ccxt ib_insync async_rithmic twilio python-telegram-bot discord.py slack-bolt tweepy metaapi-cloud-sdk; do
            python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/wheels" "$package" > "$RUNNER_TEMP/wheel-logs/${package}.log" 2>&1 || echo "$package" >> "$RUNNER_TEMP/wheel-logs/unavailable.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-linux313-wheelhouse
          path: |
            ${{ runner.temp }}/wheels/
            ${{ runner.temp }}/wheel-logs/
          retention-days: 3
          if-no-files-found: error
