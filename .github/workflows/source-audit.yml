name: Pinned copier infrastructure and dependency audit
on:
  push:
    branches: ['audit/fccf57a-e2e-20260926']
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccf57affd8515fe059b1af854856828078a737e
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Validate exact committed Terraform without planning or applying cloud resources
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cd signal-copier/deploy/terraform/oci-standby
          set +e
          terraform version > "$RUNNER_TEMP/evidence/terraform-version.txt"
          terraform init -backend=false -input=false > "$RUNNER_TEMP/evidence/terraform-init.txt" 2>&1
          echo $? > "$RUNNER_TEMP/evidence/terraform-init-exit.txt"
          terraform validate -json > "$RUNNER_TEMP/evidence/terraform-validate.json" 2>&1
          echo $? > "$RUNNER_TEMP/evidence/terraform-validate-exit.txt"
          terraform fmt -check -diff > "$RUNNER_TEMP/evidence/terraform-fmt.txt" 2>&1
          cp .terraform.lock.hcl "$RUNNER_TEMP/evidence/" || true
          cat "$RUNNER_TEMP/evidence/terraform-validate.json"
          exit 0
      - name: Parse committed replication configuration with verified Litestream release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/litestream"
          cd "$RUNNER_TEMP/litestream"
          curl --fail --location --silent --show-error -o checksums.txt https://github.com/benbjohnson/litestream/releases/download/v0.5.17/checksums.txt
          curl --fail --location --silent --show-error -o litestream-0.5.17-linux-x86_64.tar.gz https://github.com/benbjohnson/litestream/releases/download/v0.5.17/litestream-0.5.17-linux-x86_64.tar.gz
          grep ' litestream-0.5.17-linux-x86_64.tar.gz$' checksums.txt | sha256sum --check > "$RUNNER_TEMP/evidence/litestream-checksum.txt"
          tar -xzf litestream-0.5.17-linux-x86_64.tar.gz
          ./litestream version > "$RUNNER_TEMP/evidence/litestream-version.txt"
          cfg="$GITHUB_WORKSPACE/signal-copier/deploy/litestream/litestream.yml"
          env -i PATH="$PATH" LITESTREAM_R2_ENDPOINT=http://127.0.0.1:9 LITESTREAM_ACCESS_KEY_ID=audit-only LITESTREAM_SECRET_ACCESS_KEY=audit-only ./litestream databases -config "$cfg" > "$RUNNER_TEMP/evidence/litestream-parse.txt" 2>&1 || echo "parse failed" >> "$RUNNER_TEMP/evidence/litestream-parse.txt"
          cp checksums.txt "$RUNNER_TEMP/evidence/litestream-release-checksums.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-iac-validation
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fccf57affd8515fe059b1af854856828078a737e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit clean installed core environment; no application code execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python -m pip install -r signal-copier/requirements.txt > "$RUNNER_TEMP/evidence/install.txt" 2>&1
          python -m pip freeze > "$RUNNER_TEMP/evidence/application-core-lock.txt"
          python -m pip install pip-audit > "$RUNNER_TEMP/evidence/install-auditor.txt" 2>&1
          set +e
          timeout 180 python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/evidence/application-core-lock.txt" --format=json --progress-spinner=off -o "$RUNNER_TEMP/evidence/advisories.json" > "$RUNNER_TEMP/evidence/audit.log" 2>&1
          echo $? > "$RUNNER_TEMP/evidence/audit-exit.txt"
          cat "$RUNNER_TEMP/evidence/audit.log"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-dependency-advisories
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          if-no-files-found: error
