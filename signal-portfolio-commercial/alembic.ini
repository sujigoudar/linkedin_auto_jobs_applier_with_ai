[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is deliberately NOT set here -- alembic/env.py reads the
# real URL from app.config.COMMERCIAL_DATABASE_URL at runtime (or
# ALEMBIC_DATABASE_URL, when a caller needs to point migrations at a
# different database than the app's own default, e.g. a disposable test
# cluster). This keeps exactly one place (app/config.py) responsible for
# "what database does this process talk to."

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
