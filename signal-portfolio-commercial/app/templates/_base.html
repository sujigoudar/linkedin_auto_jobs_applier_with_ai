<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}signal-portfolio-commercial{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; color: #1a1a1a; background: #fafafa; }
    header { background: #111827; color: #f9fafb; padding: 0.75rem 1.25rem; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-draft { background: #fef3c7; color: #92400e; }
    .badge-validated { background: #dbeafe; color: #1e40af; }
    .badge-approved { background: #ede9fe; color: #5b21b6; }
    .badge-published { background: #d1fae5; color: #065f46; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; }
    .empty-state { padding: 2rem; text-align: center; color: #4b5563; border: 1px dashed #d1d5db; border-radius: 0.5rem; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .panel h2 { margin-top: 0; font-size: 1rem; }
    label { display: block; font-weight: 600; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; }
    input, select { width: 100%; padding: 0.4rem 0.5rem; border: 1px solid #d1d5db; border-radius: 0.25rem; box-sizing: border-box; }
    .help { color: #6b7280; font-size: 0.8rem; margin-top: 0.15rem; }
    button, .btn { background: #111827; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.9rem; }
    ul.blockers { list-style: none; padding: 0; margin: 0; }
    ul.blockers li { padding: 0.4rem 0.6rem; margin-bottom: 0.35rem; background: #fef2f2; color: #991b1b; border-radius: 0.25rem; font-size: 0.85rem; }
    .conflict { background: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem 1rem; border-radius: 0.25rem; margin-bottom: 1rem; color: #7f1d1d; }
  </style>
</head>
<body>
  <header><a href="/ops/products">signal-portfolio-commercial &mdash; operator console</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
