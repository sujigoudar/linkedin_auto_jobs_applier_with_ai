<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}signal-portfolio-commercial{% endblock %}</title>
  <link rel="stylesheet" href="/static/design-system-tokens.css">
  <link rel="stylesheet" href="/static/design-system.css">
  <link rel="stylesheet" href="/static/tier1-redesign.css">
  <link rel="stylesheet" href="/static/tier2-redesign.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; color: #1a1a1a; background: #fafafa; }
    header { background: #111827; color: #f9fafb; padding: 0.75rem 1.25rem; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-draft { background: #fef3c7; color: #92400e; }
    .badge-validated { background: #dbeafe; color: #1e40af; }
    .badge-approved { background: #ede9fe; color: #5b21b6; }
    .badge-published { background: #d1fae5; color: #065f46; }
    .badge-granted { background: #d1fae5; color: #065f46; }
    .badge-denied { background: #fee2e2; color: #991b1b; }
    .badge-revoked { background: #fee2e2; color: #991b1b; }
    .badge-unknown { background: #f3f4f6; color: #374151; }
    .badge-queued { background: #fef3c7; color: #92400e; }
    .badge-changes_requested { background: #ffedd5; color: #9a3412; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; }
    .empty-state { padding: 2rem; text-align: center; color: #4b5563; border: 1px dashed #d1d5db; border-radius: 0.5rem; }
    .panel { background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .panel h2 { margin-top: 0; font-size: 1rem; }
    label { display: block; font-weight: 600; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; }
    input, select { width: 100%; padding: 0.4rem 0.5rem; border: 1px solid #d1d5db; border-radius: 0.25rem; box-sizing: border-box; }
    .help { color: #6b7280; font-size: 0.8rem; margin-top: 0.15rem; }
    button, .btn { background: #111827; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.9rem; }
    ul.blockers { list-style: none; padding: 0; margin: 0; }
    ul.blockers li { padding: 0.4rem 0.6rem; margin-bottom: 0.35rem; background: #fef2f2; color: #991b1b; border-radius: 0.25rem; font-size: 0.85rem; }
    .conflict { background: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem 1rem; border-radius: 0.25rem; margin-bottom: 1rem; color: #7f1d1d; }
    .skip-link {
      position: absolute;
      left: -999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
      background: #111827;
      color: #f9fafb;
      padding: 0.5rem 1rem;
      border-radius: 0.25rem;
      z-index: 100;
    }
    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
      width: auto;
      height: auto;
      overflow: visible;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <nav aria-label="Primary">
      <a href="/ops">signal-portfolio-commercial &mdash; operator console</a>
    </nav>
  </header>
  <main id="main-content" role="main">
    {% block content %}{% endblock %}
  </main>
  <script>
    // app/api/dependencies.py's own get_current_scope requires a
    // csrf_token matching the caller's own web session (ID-01's cookie
    // auth) on every non-GET request -- the ONE place that token is
    // ever readable is the non-httponly "cp_csrf" cookie
    // app/api/dashboard_routes.py's _set_csrf_cookie sets right after
    // sign-in/verify. This app has no other JavaScript anywhere; this
    // is the single, central place (every real page extends this file)
    // that fills a hidden field back into every real
    // <form method="post"> so a plain server-rendered form submit still
    // carries it -- no per-template change needed, and a page with no
    // cp_csrf cookie yet (never signed in) simply submits an empty
    // field, which get_current_scope still correctly rejects.
    (function () {
      function readCookie(name) {
        var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
        return match ? decodeURIComponent(match[1]) : '';
      }
      var token = readCookie('cp_csrf');
      if (!token) return;
      document.querySelectorAll('form[method="post" i]').forEach(function (form) {
        var field = form.querySelector('input[name="csrf_token"]');
        if (!field) {
          field = document.createElement('input');
          field.type = 'hidden';
          field.name = 'csrf_token';
          form.appendChild(field);
        }
        field.value = token;
      });
    })();
  </script>
</body>
</html>
