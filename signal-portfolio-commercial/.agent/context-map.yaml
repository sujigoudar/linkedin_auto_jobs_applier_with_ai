# Trigger-based context map for signal-portfolio-commercial/.
#
# Purpose: before starting work in an area, look up that area's keywords
# below and read the listed docs FIRST, in order. This is a routing
# table, not a substitute for reading the code itself.
#
# PROVENANCE NOTE (verify before trusting a path):
#   Paths under docs/ were confirmed to exist by running, at the time
#   this file was written:
#     git fetch origin && git log --all --oneline -- signal-portfolio-commercial/docs
#   which showed commits: 06464bb (spec pack + Phase 01 rights registry),
#   4df64a7 (Phase 12 scope-ledger audit), ed530e5 (post-Phase-12
#   addendum), 34adbfa (quality standards + testing docs), 472317b (ADRs +
#   database + design + requirements docs). Paths under spec/docs/ are
#   the pre-existing spec pack (present before this file was written,
#   not part of the concurrent docs/ build-out) and were confirmed
#   present on disk directly.
#
#   Several OTHER agents are concurrently building out docs/,
#   .agent/{rules,workflows,quality-gates,permissions}.yaml,
#   PROJECT_STATUS.yaml, and a slim top-level CLAUDE.md. Entries below
#   marked `status: planned` reference a PLAUSIBLE future path by area,
#   not a confirmed one — they did not exist at write time. Re-run the
#   git log command above after that wave lands, then:
#     - fix any planned path that landed somewhere different, and
#     - prune this note once every entry below is status: confirmed.
#   Do not trust a `planned` path's content; only its existence needs
#   re-checking.

version: 1
last_verified_against_origin: 2026-09-29

areas:

