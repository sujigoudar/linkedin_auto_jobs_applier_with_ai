        status: confirmed
        why: Source spec for plans, entitlement, webhook contract.
      - path: app/models/billing.py
        status: confirmed
        why: Subscription is tenant-scoped, not per-user — read the docstring before assuming otherwise.
      - path: app/services/customer_billing.py
        status: confirmed
        why: CU-11 billing read; documents what is deliberately NOT computed (no live Stripe/invoices yet).
      - path: app/services/stripe_webhook.py
        status: confirmed
        why: Signature/replay verification; no real Stripe SDK call exists — see .agent/autonomy.yaml level 4.
      - path: docs/database/DATA_DICTIONARY.md
