[pytest]
asyncio_mode = auto
filterwarnings =
    # C07: app/context/*'s module-level AsyncLimiter instances are created
    # once at import time and live for the whole process (correct in
    # production, one continuous uvicorn event loop) -- pytest-asyncio's
    # default of a fresh event loop per test function means the SAME
    # limiter instance gets accessed from a different loop every test,
    # which aiolimiter warns about even though no state (no pending
    # waiters) actually carries over between them here. Not a production
    # concern; silenced here rather than restructuring test isolation
    # around a warning that reflects the test harness, not a real bug.
    ignore:This AsyncLimiter instance is being re-used across loops.*:RuntimeWarning
markers =
    scenario: mark test with scenario IDs from SCENARIO_CATALOG.json
