# C03 (bounded adoption, adoption plan E01/C02/C03): this ini exists mainly
# so `alembic history`/`alembic current` work from the command line for a
# human operator inspecting migration state. app/db.py's SignalStore does
# NOT read this file at runtime -- it builds its own in-process Config
# with sqlalchemy.url pointed at whatever db_path that instance was given
# (see app/db.py's _alembic_config), since one process can open many
# SignalStore instances against different SQLite files (every test does).
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///signal_copier.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
