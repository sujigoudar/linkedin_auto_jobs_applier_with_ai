[tool.mutmut]
# C31 (bounded): mutation-testing config scoped to the one module where a
# silently-wrong change is most dangerous -- owner authentication
# (password check, session validation, CSRF enforcement). See
# app/auth.py's own docstring for why this module is "fail closed, not
# fail open": a mutation that quietly weakens one of those checks (e.g.
# flipping a comparison, dropping the CSRF check for non-GET requests) is
# exactly the class of bug a mutation score can catch that a coverage
# percentage cannot -- 100% line coverage says every line ran, not that
# every line's *behavior* is actually asserted on.
#
# Baseline (app/auth.py, this track's own first commit): 105 mutants, 71
# killed, 34 survived. Most survivors are either equivalent mutants (e.g.
# rewording an HTTPException detail string the tests correctly don't
# assert on) or a defensive branch whose two directions don't actually
# differ given how RequireOwner is wired today. A handful of genuinely
# meaningful survivors -- the naive/aware expires_at normalization, and
# the two "delete the expired/revoked session, not just reject it"
# cleanup calls -- were confirmed and closed with targeted regression
# tests in tests/test_owner_auth.py rather than chased to zero here; this
# is a starting baseline, not a target score.
#
# Track 43 (2026-10-01): widened to app/engine.py, the core signal-
# processing/order-routing engine (close-signal resolution, position-
# tracking's distinct-field quantity model, provider/analyst overrides --
# see the module's own docstring). This is financially the highest-risk
# code in the service after owner auth: a silently-wrong comparison or
# dropped guard here can misroute an order, double-count a fill, or close
# the wrong quantity. only_mutate lists every test file that actually
# imports `SignalCopierEngine` (`grep -rl "from app.engine" tests/`) so
# mutmut's per-mutant run only pulls in the tests mutmut's own coverage
# pass maps to the touched function, not a blind full-suite rerun --
# see docs/state/PROGRESS.md for the baseline score and what was fixed
# vs. left as a documented equivalent-mutant/defensive-branch survivor.
#
# Track 44 (2026-10-01): widened further to the broker-agnostic
# position-lifecycle state machine (app/lifecycle/manager.py) and its
# close-arbitration/oversell-prevention ledger
# (app/lifecycle/close_arbiter.py) -- the next highest-financial-risk
# slice per the "mutation covering needs to cover every module"
# instruction, done the same deliberate, one-module-at-a-time way as the
# auth/engine slices above (not Track 43's app/engine.py, which that
# track already owns). Both modules' own docstrings describe the
# invariant this exists to protect: no two independent exit intents can
# ever both claim the same shares (see CloseArbiter's
# `reserve`/`_check_invariant`), and a partial-exit stop resize can never
# leave a moment of zero coverage (see manager.py's "stop-resize
# transition"). The test selection added below is deliberately NOT every
# test file that merely imports these modules (grep shows 40+) -- it's
# the two unit-test files for these modules themselves, plus the
# targeted regression suites for the specific financially-dangerous
# behaviors called out above (partial-exit stop amend-vs-cancel,
# duplicate-exit-episode recognition, time-exit activation).
# tests/test_trk38_quantity_conservation_and_idempotency.py (a Hypothesis
# stateful machine covering quantity conservation/idempotency) and the
# Postgres-fixture-backed integration suites (test_plain_close_race.py,
# test_p0_5_close_reconciliation.py, both already in Track 43's own
# selection above) are deliberately left out of a scoped-just-to-these-
# two-files run to keep it practical -- they still run in the full
# `pytest -q` suite and are not weakened. See docs/state/PROGRESS.md for
# the close_arbiter.py/manager.py mutation scores, what was genuinely
# fixed, and the environment-instability limitation this track hit (the
# shared container's heavy concurrent load repeatedly corrupted mutmut's
# own `.mutmut-cache`/`mutants/` state mid-run -- the same class of
# constraint Track 43 already documented for app/engine.py) that
# prevented a single clean full-aggregate rerun of the widened scope.
#
# Track 45 (2026-10-01): widened per explicit instruction ("mutation
# covering needs to cover every module") to the next three highest
# financial-risk modules, in the same deliberate, one-module-at-a-time
# way the comment above called for -- not all at once. Added:
# app/writer_lease.py (the cross-process/cross-host single-writer
# fencing mechanism -- see its own docstring; a silently-wrong lease/
# fencing-token comparison is how two processes end up believing they're
# both the active writer, or a fenced-out process keeps submitting
# commands), app/command_ledger.py (the idempotent, pre-effect
# financial-command ledger -- see its own docstring; a silently-wrong
# idempotency-key fingerprint comparison or uncertainty-state
# classification is how a retried command double-executes, or a
# genuinely ambiguous outcome gets recorded as resolved), and
# app/reconciliation.py (fill-confirmation reconciliation against
# PENDING orders and managed-lifecycle pending exits; a silently-wrong
# fill-matching/quantity-truing comparison here means a missed fill or
# a wrongly-reversed position). See CHANGELOG.md for the full writeup.
#
# Baseline for the widened scope, full `mutmut run` (819 mutants across
# all four files): 549 killed / 254 survived / 16 timeout (the timeouts
# are an artifact of running the much larger test selection this widened
# scope needs under 6-way worker parallelism, not a real behavior
# change). Per file: app/auth.py 74/51 (unchanged from before, just
# re-measured against the bigger shared test run); app/writer_lease.py
# 29/19/10-timeout; app/command_ledger.py 23/50; app/reconciliation.py
# 423/134/6-timeout. The overwhelming majority of command_ledger.py's
# survivors were simply its own classification/fingerprint helpers
# (classify_order_result, compute_fingerprint, ambiguous_evidence_for_
# exception, classify_optional_order_result) having had ZERO direct unit
# tests before this -- every branch exercised only indirectly through
# PaperBroker, which always returns FILLED. Closed with 11 new direct
# tests in tests/test_p0_2_command_ledger.py covering every branch
# (FILLED/REJECTED/PENDING-with-id/PENDING-without-id/ERROR, the
# None-vs-real-result capability check, and fingerprint order-
# independence). writer_lease.py's one genuinely dangerous survivor:
# `WriterLeaseGuard.renew()`'s happy path had NO prior test at all (only
# the already-fenced-raises case was covered) -- an `is None` -> `is not
# None` mutation there makes renew() always raise once a token is held,
# i.e. a live writer's own heartbeat would self-fence. Closed in
# tests/test_writer_lease_fencing.py, along with is_expired's exact-
# boundary case and holder_id's site-prefix format. reconciliation.py:
# triaged by hand (prioritizing the fill-matching/quantity-truing logic
# per this comment's own stated priority) and closed four confirmed real
# gaps, each hand-verified to fail against the actual mutant and pass
# against real code: (1) a FILLED SELL order's sign in `_correct_position`
# (a `+delta`/`-delta` mix-up would move the position the WRONG
# direction, not true it up -- tests/test_reconciliation.py); (2) a
# `continue` -> `break` in `_reconcile_pending_entries`'s per-entry loop
# (one account's unresolvable entry would silently stop reconciling
# every OTHER account's entry for the rest of that pass --
# tests/test_pending_fill_reconciliation_integration.py); (3)
# `_reconcile_pending_exits`'s "nothing new to report" guard requiring
# BOTH not-terminal AND no-new-progress, not either alone (an `and` ->
# `or` mutation leaves a flatly-REJECTED exit with zero new fill stuck
# forever with no protective stop -- tests/test_5e91e78_lifecycle_
# composition.py); (4) `_reconcile_broker_positions`'s exit-side
# zero-drop floor (`max(0.0, ...)` -> `max(1.0, ...)` would fabricate a
# phantom 1-unit fill for an exit that never reached the venue at all --
# tests/test_exe01_exit_response_lost.py); and a fifth, `run_now`'s
# pending_exits_examined/pending_entries_examined breakdown fields never
# having been exercised against a real lifecycle_manager at all (closed
# in tests/test_b2_b6_reconciliation_and_lifecycle_previews.py). The
# remaining ~130 reconciliation.py survivors are predominantly cosmetic
# (logger.info argument/string mutations inside exception handlers,
# which the test suite correctly doesn't assert on) plus a residual set
# of real-but-lower-severity AUD-01 field-plumbing gaps
# (confirmed_cumulative_fill/applied_execution_delta/
# outstanding_possible_fill passed as None/a wrong literal to
# `correct_position_and_update_order_status`, and analogous
# `continue`->`break`/off-by-one survivors elsewhere in
# `_reconcile_broker_positions` not yet individually triaged) --
# disclosed here as a known, time-boxed residual rather than chased to
# zero, same posture as the original C31 baseline above. A fresh
# `mutmut run` after these fixes land was not re-run to completion in
# this pass (each full run across this now-much-larger test selection
# takes 30-45+ minutes); every fix above was instead individually
# confirmed by hand-applying its exact mutant diff and checking the new
# test fails against it and passes against real code -- a real kill
# confirmation, just not a re-aggregated whole-suite score. Re-running
# `mutmut run` fresh is the natural next step before chasing the
# remaining survivors further.
#
# Track 52 (2026-10-01): widened to the realized/unrealized P&L
# computation and position-pricing slice -- app/economics.py (the
# authoritative replay-based realized P&L, cost basis, and the two
# win-rate metrics -- see its own docstring's "two win rates, not one"
# distinction), app/account_economics_v2.py (the additive extended-
# economics view that deliberately never recomputes economics.py's own
# numbers a second way -- see its own "build alongside, never recompute
# a second way" invariant), and app/pricing.py (the live PriceMonitor
# background loop that feeds on_price_update/last_observed_price, the
# only genuine source account_economics_v2.py's unrealized P&L is
# allowed to use). A silently-wrong mutation in any of these three is
# exactly a silently-wrong number the account owner is shown and
# trusts, per this track's own stated priority. Test selection below is
# each module's own direct importers only (grep -rl "from app.<module>"
# tests/), same scoping discipline as every prior track above -- plus
# tests/test_equity_history.py for economics.py specifically, since
# that file's own test_realized_pnl_matches_compute_account_economics_
# exactly is a load-bearing cross-check that economics.py's
# realized_pnl and equity_history's own snapshot stay numerically
# identical (the exact invariant account_economics_v2.py's docstring
# cites) -- a mutation that broke that equality would be a genuine,
# high-severity gap this scoping would otherwise miss. See
# docs/state/PROGRESS.md for the resulting mutation scores and what
# was fixed vs. documented as an equivalent-mutant/defensive-branch
# survivor.
#
# Track 49 (2026-10-01): widened per the same "mutation covering needs
# to cover every module" instruction to the next highest-financial-risk
# pair -- app/qualification.py (the live-routing qualification gate: the
# strict, sequential prerequisite ladder plus the feedback-capability
# floor that decides whether a route is honestly eligible to claim
# account_entitled-or-higher -- see the module's own docstring) and
# app/export_events.py (the EventEnvelope/payload builders that turn a
# genuinely FILLED OrderResult, a received Signal, or a raw SourceEvent
# into the export-outbox's actual row -- see its own docstring on why
# `build_execution_applied_envelope` must return None, never a
# best-effort partial envelope, for anything short of a fully-confirmed
# fill). Run at 3-way concurrency (not the previous wave's 6) per this
# track's own instruction, after 6-way parallelism on this shared
# container corrupted mutmut's cache mid-run in an earlier track. Test
# selection is each new file's own dedicated unit-test file
# (tests/test_route_qualification.py, tests/test_export_events.py),
# same narrow-selection style as every track above. See
# docs/state/PROGRESS.md for the resulting mutation score, what was
# genuinely fixed vs. left as a documented equivalent-mutant survivor.
#
# Track 54 (2026-10-01): widened per the same "mutation covering needs
# to cover every module" instruction to app/brokers/paper.py (the
# in-memory PaperBroker -- the reference managed-lifecycle broker every
# paper-trading account actually executes against today, including its
# genuinely-computed simulated cash/buying-power bookkeeping -- see the
# module's own docstring) and app/brokers/base.py (the BrokerAdapter
# base class every execution destination implements: the capability-
# introspection properties that gate live admission, e.g.
# app/qualification.py's feedback-dependent floor and
# app/lifecycle/manager.py's `validate_plan`). Test selection: each
# file's own dedicated unit-test files
# (tests/test_paper_broker.py, tests/test_paper_broker_lifecycle_capabilities.py,
# tests/test_account_balance_capability.py,
# tests/test_adp02_adp06_bracket_capability_verification.py) plus two
# already-present files that also directly exercise these two modules
# (tests/test_broker_capability_gate.py, tests/test_asset_class_gate.py
# -- both already in the list above from an earlier track, kept as-is).
# Same CLI mismatch prior widening tracks hit: this host's globally
# installed `mutmut` resolves to a repackaged build that calls itself
# "2.5.1" but has a different, 3.x-shaped CLI (`mutmut run` there takes
# only `--max-children`/`[MUTANT_NAMES]` and silently ignores
# `only_mutate`/`pytest_add_cli_args_test_selection` from this table,
# mutating every file under `source_paths` instead). Worked around the
# same way: an isolated venv with the real PyPI `mutmut<3` (2.5.1)
# pinned, which DOES read `only_mutate`/`pytest_add_cli_args_test_selection`
# from this table and also exposes the classic `--paths-to-mutate`/
# `--runner` flags -- the actual invocation used here was
# `mutmut run --paths-to-mutate="app/brokers/paper.py,app/brokers/base.py" \
#   --runner="python -m pytest -x -q tests/test_paper_broker.py \
#   tests/test_paper_broker_lifecycle_capabilities.py \
#   tests/test_account_balance_capability.py \
#   tests/test_adp02_adp06_bracket_capability_verification.py \
#   tests/test_broker_capability_gate.py tests/test_asset_class_gate.py"`
# (the explicit flags take priority over this table's `only_mutate`/
# `pytest_add_cli_args_test_selection` for a scoped single-pass run, same
# as every prior track's own workaround). See docs/state/PROGRESS.md for
# the resulting mutation score and what was genuinely fixed vs. left as
# a documented equivalent-mutant survivor.
#
# source_paths must cover the whole importable "app" package (mutmut
# copies it verbatim into mutants/app/ so the test suite's `import
# app.main` etc. still resolves) plus alembic/ (app/db.py stamps
# migrations at import time, so app/main.py's own import chain needs a
# real alembic/ directory alongside the mutated app/ package); only_mutate
# is what actually narrows the mutation scope to the listed files --
# every other file under app/ is copied unmutated.
