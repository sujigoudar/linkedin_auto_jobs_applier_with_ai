#cloud-config
# First-boot script for the OCI standby. Installs the application and a
# read-only status page. Deliberately does NOT enable the trading service,
# does NOT write ACCOUNTS_CONFIG_PATH/broker credentials, and does NOT run
# `restore_from_store()` against a live position -- see RUNBOOK.md for the
# actual promotion steps a human runs later.

package_update: true
packages:
  - python3.11
  - python3.11-venv
  - git
  - sqlite3
  - curl

write_files:
  - path: /etc/signal-copier/standby.env
    permissions: "0600"
    content: |
      # Standby-only environment. No OWNER_PASSWORD, no broker credentials,
      # no WEBHOOK_SHARED_SECRET -- this process must never accept a
      # financial command. It only serves GET /health and (once wired)
      # a Litestream-restored, read-only copy of the database for
      # inspection. Fill in real values only as part of RUNBOOK.md's
      # promotion procedure, never at boot.
      DATABASE_PATH=/var/lib/signal-copier/signal_copier.db
      LOG_LEVEL=INFO

runcmd:
  - mkdir -p /opt/signal-copier /var/lib/signal-copier
  - useradd --system --home /opt/signal-copier --shell /usr/sbin/nologin signal-copier || true
  - chown -R signal-copier:signal-copier /opt/signal-copier /var/lib/signal-copier
  # Clone the exact reviewed revision -- pin a tag/commit, never `main`/HEAD,
  # so the standby's code matches what was actually tested and released.
  - |
    su - signal-copier -s /bin/bash -c "
      git clone --branch REPLACE_WITH_RELEASED_TAG https://github.com/sujigoudar/linkedin_auto_jobs_applier_with_ai /opt/signal-copier/src &&
      cd /opt/signal-copier/src/signal-copier &&
      python3.11 -m venv /opt/signal-copier/venv &&
      /opt/signal-copier/venv/bin/pip install --no-cache-dir -r requirements.txt
    "
  - cp /opt/signal-copier/src/signal-copier/deploy/systemd/signal-copier-standby-status.service /etc/systemd/system/
  - systemctl daemon-reload
  - systemctl enable signal-copier-standby-status.service
  - systemctl start signal-copier-standby-status.service
  # The trading unit is installed but intentionally left disabled:
  - cp /opt/signal-copier/src/signal-copier/deploy/systemd/signal-copier.service /etc/systemd/system/
  - systemctl daemon-reload
  # NOTE: deliberately no `systemctl enable signal-copier.service` here.
