  initial_state: Rule lists [acct on unregistered broker, acct on paper] (single mode)
  event_sequence: Buy signal
  expected_invariant: Missing-broker account yields ERROR result, next alternative still gets the single
    allocation
  status: covered
  impl_status: implemented
  tests:
  - tests/test_engine.py::test_missing_broker_reports_error_without_blocking_others
  evidence: Asserts missing-broker account ERROR and second account FILLED (default single mode).
  notes: Only paper + nonexistent broker; no test with two real adapters of different families in single
    mode.
