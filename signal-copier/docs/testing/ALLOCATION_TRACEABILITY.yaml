# Allocation scenario traceability registry.
# Generated from a read-only review of the code and tests, then validated mechanically by
# tests/test_alloc10_traceability.py (every referenced test function must exist).
# status: covered | partial | unit-only | gap. impl_status: implemented | partial | missing.
# A 'covered' row is covered in an isolated/paper environment only; nothing here is broker-qualified.
- id: A-01
  group: A account identity/lifecycle
  scenario: Signal arrives with no usable account (none configured / all removed)
  initial_state: Rule exists but its only account was deleted, or no accounts
  event_sequence: Webhook buy for routed source
  expected_invariant: Engine returns no orders, no broker call, no crash; signal still journaled
  status: covered
  impl_status: implemented
  tests:
  - tests/test_config_crud.py::test_deleting_an_account_removes_it_from_routing_immediately
  evidence: Webhook after account deletion returns orders == [] via real API->engine path.
  notes: Unit helper test_routing_config_with_only_rules_no_accounts_is_safe (tests/test_track57_routing_mutations.py)
    not counted.
- id: A-02
  group: A account identity/lifecycle
