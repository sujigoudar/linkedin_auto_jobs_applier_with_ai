# Destination accounts. No secrets here — broker credentials live in
# environment variables (see .env.example), referenced by account_id.
accounts:
  paper_main:
    broker: paper
    multiplier: 1.0
    enabled: true

  binance_sub1:
    broker: ccxt
    multiplier: 0.5          # trade half the source signal's size
    enabled: true
    symbol_map:
      BTCUSDT: BTC/USDT      # TradingView-style symbol -> ccxt unified symbol
      ETHUSDT: ETH/USDT

  binance_sub2:
    broker: ccxt
    fixed_quantity: 0.01     # always trade a flat 0.01, ignoring source size
    enabled: false

  ibkr_main:
    # SignalStack does the actual broker connection on its side (IBKR here);
    # this service just forwards the sized/mapped signal to its webhook.
    broker: signalstack
    multiplier: 1.0
    enabled: false

  bybit_main:
    broker: signalstack
    multiplier: 0.25
    enabled: false

  main:
    # MT4/MT5 via MetaApi (broker: mt4_mt5_metaapi) or same-host MT5
    # (broker: mt4_mt5) — env vars are read using this account_id, e.g.
    # MT4_MT5_METAAPI_MAIN_ID or MT5_MAIN_LOGIN. See .env.example.
    broker: mt4_mt5_metaapi
    multiplier: 1.0
    enabled: false
    symbol_map:
      EURUSD: EURUSD

  ninjatrader_main:
    broker: ninjatrader
    multiplier: 1.0
    enabled: false

  rithmic_main:
    broker: rithmic
    multiplier: 1.0
    enabled: false
    symbol_map:
      ES: ESZ5   # source symbol -> Rithmic's actual contract code (update each roll)
