# Optional per-provider/per-analyst settings overrides. `providers` here are
# matched by Signal.source (e.g. "telegram", "tradingview"); `analysts` are
# matched by Signal.analyst (only set by a source parser that can identify
# who within that source posted the signal — most can't, and that's fine,
# provider-level overrides still apply).
#
# Precedence, narrowest wins: account (accounts.yaml) -> provider -> analyst.
# Any field left unset at a level inherits from the next broader one. This
# file is entirely optional — no config/providers.yaml means every signal
# uses its destination account's own settings unchanged.
providers:
  telegram:
    display_name: "Telegram signals channel"
    multiplier: 0.5  # trade this provider's signals at half size across every account, by default
    analysts:
      alice:
        display_name: "Alice (swing trades)"
        multiplier: 1.0  # Alice's own signals override the provider default back to full size
      bob:
        display_name: "Bob (high-frequency scalps)"
        enabled: false  # muted for now — Bob's signals are received and logged but never routed

  tradingview:
    display_name: "TradingView webhook alerts"
    managed_lifecycle: true  # force every TradingView-sourced signal through the protect-first path
