services:
  signal-copier:
    build:
      context: .
      # args:
      #   EXTRAS: "ccxt tweepy"   # uncomment and list whichever optional adapters you need
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Config files: edit these on the host, no rebuild needed.
      - ./config:/app/config
      # Database: named volume so the signal/order/position log survives
      # container recreation (a bind mount to a single file is flakier
      # across platforms for SQLite's locking).
      - signal_copier_db:/app/data
    environment:
      DATABASE_PATH: /app/data/signal_copier.db
    restart: unless-stopped

volumes:
  signal_copier_db:
